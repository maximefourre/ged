services:
  postgres:
    image: postgres:17
    # Default max_connections (100) fits ~3 worker replicas (~19 connections
    # each at JOB_THREADS=3, see the worker-scaling spec); 200 covers ~9.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      # Published so host-native `bin/rails test` / `bin/dev` connect to this
      # Dockerised Postgres (dev/test databases live here, not in Homebrew PG).
      # GED_DB_PORT lets bin/worktree-stack publish an isolated host port per
      # worktree; defaults to 5432 for the primary-tree stack.
      - "${GED_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  oauth-provider:
    build: ./oauth-provider
    environment:
      OAUTH_ISSUER: http://oauth-provider:9292
      OAUTH_AUDIENCE: ${GED_OIDC_AUDIENCE:-http://web:80}
    ports:
      # GED_OAUTH_PORT lets bin/worktree-stack publish an isolated host port per
      # worktree; defaults to 9292 for the primary-tree stack.
      - "${GED_OAUTH_PORT:-9292}:9292"
    volumes:
      - oauth_data:/app/data

  web:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      oauth-provider:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ged_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run with SECRET_KEY_BASE=$(bin/rails secret)}
      RAILS_ENV: production
      GED_OIDC_ISSUER: http://oauth-provider:9292
      GED_OIDC_JWKS_URL: http://oauth-provider:9292/.well-known/jwks.json
      GED_OIDC_AUDIENCE: ${GED_OIDC_AUDIENCE:-http://web:80}
      GED_ADMIN_USERNAME: ${GED_ADMIN_USERNAME:-admin}
      GED_ADMIN_PASSWORD: ${GED_ADMIN_PASSWORD:?set GED_ADMIN_PASSWORD}
      # OpenTelemetry export. Empty endpoint = OTel entirely disabled (see
      # config/initializers/opentelemetry.rb), so this is harmless by default.
      # To enable with the local backend below, set in .env:
      #   COMPOSE_PROFILES=otel
      #   GED_OTEL_ENDPOINT=http://otel-lgtm:4318
      # (or run bin/worktree-stack with GED_OTEL=1, which sets both).
      OTEL_SERVICE_NAME: ged
      OTEL_EXPORTER_OTLP_ENDPOINT: ${GED_OTEL_ENDPOINT:-}
      # Thruster body cap — the only layer that stops an oversized upload
      # before it reaches Rack (no tempfile written). Mirrors Document::MAX_BYTE_SIZE.
      MAX_REQUEST_BODY: ${GED_MAX_UPLOAD_BYTES:-52428800}
    ports:
      # 80 is Thruster (X-Sendfile + compression in front of Puma, see
      # Dockerfile CMD); mapping Puma's 3000 directly would bypass it.
      # GED_WEB_PORT lets bin/worktree-stack publish an isolated host port per
      # worktree; defaults to 3000 for the primary-tree stack.
      - "${GED_WEB_PORT:-3000}:80"
    volumes:
      - storage:/rails/storage
    healthcheck:
      # Workers depend on web being healthy: bin/docker-entrypoint runs
      # db:prepare only for `rails server`, so web must have prepared the
      # schemas before a worker boots. start_period covers that first boot.
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 60s

  # Solid Queue supervisor (dispatcher + scheduler + worker pools from
  # config/queue.yml). Scale on the same host, hot, without touching web:
  #   docker compose up -d --scale worker=N   (bin/worktree-stack up --scale worker=N)
  # Replicas coordinate via Postgres (FOR UPDATE SKIP LOCKED); recurring
  # tasks are deduped by the unique [task_key, run_at] index. Shares the
  # storage volume with web: staging files (storage/staging/) are written by
  # web and read here; Active Storage blobs are written here and served by
  # web — same-host scaling only (see the worker-scaling spec).
  worker:
    build: .
    command: ["./bin/jobs"]
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ged_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run with SECRET_KEY_BASE=$(bin/rails secret)}
      RAILS_ENV: production
      JOB_THREADS: ${JOB_THREADS:-3}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-1}
      # oidc_config.rb raises at boot in production without these, even
      # though the worker never validates tokens.
      GED_OIDC_ISSUER: http://oauth-provider:9292
      GED_OIDC_JWKS_URL: http://oauth-provider:9292/.well-known/jwks.json
      GED_OIDC_AUDIENCE: ${GED_OIDC_AUDIENCE:-http://web:80}
      # Jobs emit most custom metrics (ged.job.duration, uploads, callbacks)
      # and now run here, not in Puma — same OTel wiring as web (empty
      # endpoint = disabled).
      OTEL_SERVICE_NAME: ged
      OTEL_EXPORTER_OTLP_ENDPOINT: ${GED_OTEL_ENDPOINT:-}
    volumes:
      - storage:/rails/storage
    # Must exceed solid_queue.shutdown_timeout (30s) so a scale-down or
    # `compose stop` lets in-flight StoreDocumentJobs drain cleanly.
    stop_grace_period: 40s

  # Local observability backend: OTel collector + Prometheus + Tempo + Loki +
  # Grafana in one container. Dev tooling only — off unless the "otel" compose
  # profile is active (COMPOSE_PROFILES=otel in .env, or GED_OTEL=1 via
  # bin/worktree-stack). `web` deliberately has no depends_on on this service:
  # with GED_OTEL_ENDPOINT empty the app never exports, so ordering is moot.
  otel-lgtm:
    image: grafana/otel-lgtm:0.29.0
    profiles: ["otel"]
    ports:
      # Grafana UI. Base 3300, NOT 3000: worktree web ports occupy 3000-3250.
      - "${GED_GRAFANA_PORT:-3300}:3000"
      # OTLP http, published so host-native `bin/dev` can export too
      # (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:<port>).
      - "${GED_OTLP_PORT:-4318}:4318"
    volumes:
      - ./observability/grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - lgtm_data:/data

volumes:
  pgdata:
  oauth_data:
  storage:
  lgtm_data:
