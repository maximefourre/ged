name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  rust:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        env:
          # Primary-tree checkout: bin/worktree-stack db-port prints 5432,
          # which is this service container. Parity and Playwright stay out
          # of this job: they need the worktree compose stack. bin/ci runs
          # them when that stack answers GET /up.
          GED_DB_PORT: "5432"
        run: cargo test -p ged

      - name: Cargo audit
        working-directory: rust
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: oauth-provider
          bundler-cache: true

      - name: oauth-provider tests
        working-directory: oauth-provider
        run: bundle exec rake

      - name: Ruby syntax
        run: ruby -c bin/perf-upload && ruby -c bin/monkey

      - name: bundler-audit
        run: |
          gem install bundler-audit --no-document
          bundle-audit update
          bundle-audit check --gemfile-lock oauth-provider/Gemfile.lock

      - name: Build Rust image
        run: docker build -t ged:ci .
