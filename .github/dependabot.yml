version: 2
updates:
- package-ecosystem: bundler
  directory: "/oauth-provider"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: cargo
  directory: "/rust"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/rust/e2e"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
