[package]
name = "ged"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.34"
http-body = "1"
http-body-util = "0.1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
regex = "1"
tokio-util = { version = "0.7", features = ["io"] }
multer = "3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }

askama = "0.14"
hmac = "0.12"
base64 = "0.23.1"

[dev-dependencies]
base64 = "0.23.1"
sha2 = "0.11"
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.29.0", features = ["v7"] }
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
serde_yaml = "0.9"
