[package]
name = "ged"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = "0.8"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.34"
http-body = "1"
http-body-util = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
uuid = "1.29.0"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.29.0", features = ["v7"] }
