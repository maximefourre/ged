openapi: 3.1.0
info:
  title: GED API
  version: "1.0.0"
  description: |
    HTTP API for the GED document store. Documents live under departments
    (the permission boundary) and carry a single-level key→value tag map.

    ## Authentication

    Every `/api/v1` endpoint (except this spec and the docs page) requires a
    JWT bearer token: `Authorization: Bearer <token>`.

    During the OAuth2 stopgap, tokens come from the local dev provider's
    `client_credentials` flow:

    ```
    curl -X POST http://localhost:9292/token \
      -d grant_type=client_credentials \
      -d client_id=<id> -d client_secret=<secret>
    ```

    The `client_id` must also be registered in the GED admin UI and granted
    access to at least one department, otherwise calls return `403`.

    ## Permissions

    Each department grant carries independent **read** and **write** flags,
    and covers the department's whole subtree. Read gates listing, fetching,
    downloading and polling; write gates uploading, deleting, replacing tags
    and creating sub-departments. Write does **not** imply read: a write-only
    client can upload (and receives the created document in the response) but
    cannot list or fetch it back.

    ## Errors

    Errors share the shape `{ "error": "<message>" }`:

    - `400` — missing or non-scalar parameter, or a malformed JSON request body
    - `401` — missing or invalid token
    - `403` — client not registered, or no read (resp. write) access to the department
    - `404` — resource not found
    - `422` — validation failed
servers:
  - url: http://localhost:3000
    description: Local / Docker Compose (Puma behind Thruster on :3000)
tags:
  - name: Meta
    description: Connectivity check
  - name: Documents
    description: Upload, list, fetch, tag and delete documents
  - name: Departments
    description: Department tree (permission boundary)
  - name: Upload requests
    description: Status of asynchronous uploads
security:
  - bearerAuth: []
paths:
  /api/v1/ping:
    get:
      tags: [Meta]
      summary: Verify the token and echo the calling client
      operationId: ping
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    type: string
                    description: The authenticated client's identifier
                    example: my-app
                required: [client]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/documents:
    get:
      tags: [Documents]
      summary: List accessible documents
      description: |
        Returns documents in departments the client has **read** access to,
        newest first. Optional filters narrow the set; `tag_value` requires `tag`.
      operationId: listDocuments
      parameters:
        - name: department_id
          in: query
          description: Restrict to this department and its subtree
          schema:
            type: integer
        - name: filename
          in: query
          description: Case-insensitive substring match on the filename
          schema:
            type: string
        - name: tag
          in: query
          description: Only documents that have this tag key
          schema:
            type: string
          example: type
        - name: tag_value
          in: query
          description: Combined with `tag`, require this exact value. Requires `tag`.
          schema:
            type: string
          example: facture
        - name: uploaded_by
          in: query
          description: Only documents uploaded by this client (owner)
          schema:
            type: string
          example: erp-app
        - name: upload_mode
          in: query
          description: Filter by how the document was stored (sync vs async)
          schema:
            type: string
            enum: [sync, async]
        - name: uploaded_after
          in: query
          description: Only documents whose upload time is at or after this ISO8601 datetime
          schema:
            type: string
            format: date-time
        - name: uploaded_before
          in: query
          description: Only documents whose upload time is at or before this ISO8601 datetime
          schema:
            type: string
            format: date-time
        - name: indexed_after
          in: query
          description: Only documents whose indexation time (created_at) is at or after this ISO8601 datetime
          schema:
            type: string
            format: date-time
        - name: indexed_before
          in: query
          description: Only documents whose indexation time (created_at) is at or before this ISO8601 datetime
          schema:
            type: string
            format: date-time
        - name: updated_after
          in: query
          description: Only documents last updated at or after this ISO8601 datetime
          schema:
            type: string
            format: date-time
        - name: updated_before
          in: query
          description: Only documents last updated at or before this ISO8601 datetime
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Documents]
      summary: Upload a document (synchronous or asynchronous)
      description: |
        Multipart upload — requires **write** access to the department. Without
        `callback_url` the file is stored inline and the created document is
        returned (`201`). With `callback_url` the file is staged, a background
        job stores it, and the endpoint returns `202` immediately; the result
        is later POSTed to the callback URL and can also be polled via
        `GET /api/v1/upload_requests/{id}`.

        `callback_url` must point at a **publicly routable** http(s) host:
        private, loopback and link-local targets are rejected with `422` at
        upload time, and refused again (after DNS resolution) at delivery time.

        Uploads larger than the configured maximum (default 50 MiB) are
        rejected with `422`.

        Tags are passed as nested params, e.g. `tags[type]=facture&tags[urgent]=`
        (a blank value stores `null`).
      operationId: createDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                department_id:
                  type: integer
                  description: Target department (requires write access)
                file:
                  type: string
                  format: binary
                  description: The file to store
                callback_url:
                  type: string
                  format: uri
                  description: >
                    If present, upload is asynchronous and this URL receives the
                    result. Must resolve to a public address (private/loopback/
                    link-local targets → 422).
                  example: https://webhook.site/xxxx
                tags:
                  type: object
                  additionalProperties:
                    type: string
                    nullable: true
                  description: Key→value tag map (nested params, e.g. tags[type]=facture)
                  example:
                    type: facture
              required: [department_id, file]
      responses:
        "201":
          description: Document stored (synchronous)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "202":
          description: Upload accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/documents/{id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      summary: Fetch a document's metadata
      description: Requires read access to the document's department.
      operationId: getDocument
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Documents]
      summary: Delete a document
      description: >
        Requires write access. Soft-deletes the document: it is hidden
        immediately (subsequent reads return 404) and its file is retained for
        a 30-day window, after which a scheduled job permanently purges it. An
        admin can restore it from the admin Trash before the purge date.
      operationId: deleteDocument
      responses:
        "204":
          description: Soft-deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{id}/download:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      summary: Download a document's file
      description: Requires read access to the document's department.
      operationId: downloadDocument
      responses:
        "200":
          description: The file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    put:
      tags: [Documents]
      summary: Replace a document's whole tag map
      description: |
        Requires write access. Map semantics: the client owns the full map. The
        supplied `tags` replace the existing map wholesale; omitting `tags`
        clears it.
      operationId: replaceDocumentTags
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  $ref: "#/components/schemas/Tags"
            example:
              tags:
                type: facture
                urgent: null
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                tags:
                  $ref: "#/components/schemas/Tags"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/departments:
    get:
      tags: [Departments]
      summary: List accessible departments
      description: Returns the departments the client has read access to.
      operationId: listDepartments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Accessible departments, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Departments]
      summary: Create a sub-department
      description: Creates a child of `parent_id`, which requires write access. The `parent_id` parameter is required and non-null; top-level departments can only be created by an admin.
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                  description: Required parent department ID. Top-level departments can only be created by an admin.
                name:
                  type: string
              required: [parent_id, name]
            example:
              parent_id: 1
              name: Accounting
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                name:
                  type: string
              required: [parent_id, name]
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/upload_requests/{id}:
    get:
      tags: [Upload requests]
      summary: Poll the status of an asynchronous upload
      description: |
        Requires read access to the upload's department. Mirrors the callback
        payload. `status` is one of `pending`, `processing`, `completed`,
        `failed`. `document_id` and `tags` are populated once the upload
        completes; `error_message` is set on failure.
      operationId: getUploadRequest
      parameters:
        - name: id
          in: path
          required: true
          description: The upload request id (returned by an async upload)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRequestStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtained from the OAuth2 client_credentials flow at
        http://localhost:9292/token (dev provider).
    oauth2ClientCredentials:
      type: oauth2
      description: |
        The bearer tokens above are issued by this flow. Documented for
        reference; GED itself acts only as a resource server.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:9292/token
          scopes: {}

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size (default 100, max 500)
      schema:
        type: integer
        default: 100
        maximum: 500
        minimum: 1
    Offset:
      name: offset
      in: query
      description: Rows to skip (default 0, max 1000000)
      schema:
        type: integer
        default: 0
        minimum: 0
        maximum: 1000000
    DocumentId:
      name: id
      in: path
      required: true
      description: Document UUID
      schema:
        type: string
        format: uuid

  schemas:
    Tags:
      type: object
      additionalProperties:
        type: string
        nullable: true
      description: |
        Single-level key→value map. Keys are non-empty strings (≤100 chars,
        stored lower-cased); values are strings (≤500 chars) or null; at most
        50 entries.
      example:
        type: facture
        urgent: null

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          example: invoice.pdf
        content_type:
          type: string
          nullable: true
          example: application/pdf
        byte_size:
          type: integer
          example: 20481
        department_id:
          type: integer
        uploaded_by:
          type: string
          description: The client identifier that uploaded the document (its owner)
          example: my-app
        tags:
          $ref: "#/components/schemas/Tags"
        created_at:
          type: string
          format: date-time
          description: Indexation date — when the document was stored/indexed
        metadata:
          $ref: "#/components/schemas/DocumentMetadata"
      required:
        - id
        - filename
        - byte_size
        - department_id
        - uploaded_by
        - tags
        - created_at
        - metadata

    DocumentMetadata:
      type: object
      description: Readonly, system-managed document metadata.
      properties:
        uploaded_at:
          type: string
          format: date-time
          description: Original upload time (async — request time; sync — creation time)
        updated_at:
          type: string
          format: date-time
          description: Last modification (currently the last tag edit)
        upload_mode:
          type: string
          enum: [sync, async]
          description: How the document was stored
      required: [uploaded_at, updated_at, upload_mode]

    Department:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Finance
        parent_id:
          type: integer
          nullable: true
          description: null for a root department
      required: [id, name, parent_id]

    AsyncAccepted:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
      required: [request_id, status]

    UploadRequestStatus:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed]
        document_id:
          type: string
          format: uuid
          nullable: true
          description: Set once the upload completes
        error_message:
          type: string
          nullable: true
          description: Set when status is failed
        tags:
          oneOf:
            - $ref: "#/components/schemas/Tags"
            - type: "null"
          description: The stored document's tags once completed, otherwise null
        metadata:
          oneOf:
            - $ref: "#/components/schemas/DocumentMetadata"
            - type: "null"
          description: The stored document's readonly metadata once completed, otherwise null
      required: [request_id, status, document_id, error_message, tags, metadata]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
      example:
        error: not found

  responses:
    BadRequest:
      description: Missing or invalid parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Client not registered, or no read (resp. write) access to the department
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
